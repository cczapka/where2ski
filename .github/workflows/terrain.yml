name: terrain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-tools.txt

      - name: Build terrain data from OpenSkiData
        run: python -m tools.terrain --registry data/resorts.json --out data/terrain.json --cache cache/terrain

      - name: Commit terrain data
        run: |
          git config user.name "where2ski-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/terrain.json
          if git diff --cached --quiet; then
            echo "terrain.json unchanged"
            exit 0
          fi
          git commit -m "Update terrain data (aspect roses) from OpenSkiData"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
