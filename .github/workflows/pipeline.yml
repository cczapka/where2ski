name: pipeline

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-

      - name: Check out the forecast archive (data branch)
        run: |
          if git fetch --depth=1 origin data:refs/remotes/origin/data 2>/dev/null; then
            git worktree add --detach archive origin/data
          else
            echo "data branch missing: creating it from the stored snapshots"
            git worktree add --orphan -b data archive
            python -m tools.snapshots_to_archive data/snapshots archive
          fi
          ls -la archive

      - name: Run pipeline
        run: python -m where2ski_pipeline run --registry data/resorts.json --out out --cache cache --record recording --archive archive -v

      - name: Verification against stations
        run: python -m tools.verify score --archive archive --out out

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          d = json.load(open("out/latest.json"))
          print("generated", d["generated_at"], "today", d["today"])
          print("sources", json.dumps(d["status"]["sources"], indent=1)[:4000])
          print("road waypoints:", ", ".join(d["status"]["sources"].get("roads", {}).get("waypoints", [])) or "none")
          for r in d["resorts"]:
              t = r["days"][0] if r["days"] else None
              road = (t or {}).get("roads")
              if road:
                  print(f"roads {r['id']:22} {road['waypoint'][:26]:26} {road['elevation']:5} m  "
                        f"snow {road['snowfall_cm']:5.1f} cm  rain {road['rain_mm']:5.1f} mm  "
                        f"factor {t['factors']['roads']:.2f}")
              else:
                  print(f"roads {r['id']:22} no pass on the drive           factor {(t or {}).get('factors', {}).get('roads')}")
          for r in d["resorts"][:41]:
              for st in r.get("stations", [])[:1]:
                  print(f"station sample {r['id']:22} {st['name'][:28]:28} {st.get('elevation')} m  hs {st.get('hs')} hn24 {st.get('hn24')} "
                        f"t {st.get('t_air')} tss {st.get('t_surface')} gust {st.get('gust')} at {st.get('time')}")
          for r in sorted(d["resorts"], key=lambda x: -(x["days"][0]["scores"]["freeride"] if x["days"] else 0))[:15]:
              t = r["days"][0] if r["days"] else None
              if t:
                  print(f"{r['name'][:34]:34} fr {t['scores']['freeride']:5.1f} pi {t['scores']['piste']:5.1f} "
                        f"{t['snow']['state']:15} hn24 {t['snow']['hn24']:5.1f} hs {str(t['snow']['hs']):>5} ({t['snow']['hs_source']}) "
                        f"sun {t['weather']['sun_hours']:4.1f}h stations {len(r['stations'])} region {r['micro_region']}")
              else:
                  print(r["name"], "ERROR", r.get("error"))
          PY

      - name: Push the forecast archive
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        working-directory: pipeline/archive
        run: |
          git add -A .
          if git diff --cached --quiet; then
            echo "archive unchanged"
            exit 0
          fi
          git -c user.name="where2ski-bot" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Archive $(date -u +%F' '%H:%M) UTC"
          git push origin HEAD:refs/heads/data

      - name: Monthly date stamp (keeps the scheduled workflow enabled)
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat data/last_run_month.txt 2>/dev/null)" = "$month" ]; then exit 0; fi
          echo "$month" > data/last_run_month.txt
          git config user.name "where2ski-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_run_month.txt
          git commit -q -m "Pipeline still running: ${month}"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep the raw responses for offline replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ github.run_id }}
          path: pipeline/recording
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pipeline/out

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
